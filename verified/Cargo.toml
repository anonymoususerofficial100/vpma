[package]
name = "vpma-verified"
version = "0.1.0"
edition = "2021"

[dependencies]
verus_builtin        = { version = "0.0.0-2026-08-02-0125" }
verus_builtin_macros = { version = "0.0.0-2026-08-02-0125" }
vstd           = { version = "0.0.0-2026-08-02-0125", default-features = false, features = ["alloc"] }

sha2 = { version = "0.10", default-features = false }

[package.metadata.verus]
verify = true

[lib]
path = "src/lib.rs"
