[package]
name = "sgx_vm"
version = "1.0.0"
edition = "2021"

[dependencies]
vpma-verified = { path = "../verified" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
hmac = { version = "0.12", default-features = false }
sha2 = { version = "0.10", default-features = false }

hex = { version = "0.4", default-features = false, features = ["alloc"] }
mbedtls = { version = "0.12", features = ["std", "ssl", "x509", "rdrand"], optional = true }

[target.'cfg(target_env = "sgx")'.dependencies]
rdrand = "0.8"
aes-gcm = { version = "0.10", default-features = false, features = ["aes", "alloc"] }
sgx-isa = "0.4"

[features]
default = []
use_mbedtls = ["mbedtls"]

[lib]
path = "src/lib.rs"
crate-type = ["rlib"]

[[bin]]
name = "sgx_vm"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = true
panic = "abort"

[profile.dev]
panic = "abort"
